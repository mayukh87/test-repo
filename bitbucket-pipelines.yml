image: python:3.11

definitions:
  steps:
    - step: &ci-checks
        name: CI - Code Quality Checks
        caches:
          - pip
        script:
          - echo "Installing uv package manager..."
          - pip install uv
          - uv --version
          - echo "Installing ruff linter..."
          - uv tool install ruff
          - ruff --version
          - echo "Running ruff linting checks..."
          - ruff check . --output-format=github
          - echo "Running ruff format checks..."
          - ruff format --check .
          - echo "Running uv dependency checks..."
          - uv sync --check
          - echo "All CI checks completed successfully!"
        artifacts:
          - ruff-report.json

    - step: &cd-deploy
        name: CD - Deploy to Environment
        services:
          - docker
        script:
          - echo "Starting deployment to $ENVIRONMENT environment..."
          - echo "Installing prerequisites..."
          - apt-get update && apt-get install -y unzip wget curl
          - echo "Installing AWS CLI v2..."
          - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          - unzip awscliv2.zip
          - ./aws/install
          - aws --version
          - echo "Configuring AWS credentials..."
          - aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          - aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          - aws configure set default.region "$AWS_DEFAULT_REGION"
          - echo "Installing Terraform, TFLint, and tfsec..."
          - wget https://releases.hashicorp.com/terraform/1.8.2/terraform_1.8.2_linux_amd64.zip
          - unzip terraform_1.8.2_linux_amd64.zip
          - mv terraform /usr/local/bin/
          - terraform version
          - curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          - tflint --version
          - curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
          - tfsec --version
          - echo "Running terraform lint and security checks..."
          - tflint --color --format compact || echo "TFLint failed but continuing..."
          - tfsec
          - echo "Selected environment: $ENVIRONMENT"
          - terraform init
          - echo "Switching to $ENVIRONMENT workspace..."
          - terraform workspace select $ENVIRONMENT || terraform workspace new $ENVIRONMENT
          - echo "Successfully switched to $ENVIRONMENT workspace"
          - terraform workspace show
          - echo "Deployment to $ENVIRONMENT completed successfully!"

pipelines:
  # CI Pipeline - Automatic trigger on pushes
  branches:
    '{main,develop,feature/**,hotfix/**}':
      - step: *ci-checks

  # CD Pipeline - Manual trigger with environment selection
  custom:
    deploy-to-environment:
      - variables:
          - name: ENVIRONMENT
            description: "Select the target environment for deployment"
            allowed-values:
              - dev
              - qa
              - prod
            default: dev
      - step: *cd-deploy

  # Pull Request Pipeline - Run CI checks
  pull-requests:
    '**':
      - step: *ci-checks