image: python:3.11

pipelines:
  branches:
    '{main,feature/**}':
      - step:
          name: CI - Ruff & uv checks
          caches:
            - pip
          script:
            - pip3 install --upgrade pip
            - pip3 install ruff uv
            - ruff check . || echo "Ruff linting failed, continuing anyway."
            # Uncomment if the below is needed.
            - uv venv
            - uv pip install -r requirements/requirements.txt
            - uv pip check || echo "Dependency validation failed, continuing anyway."
            - echo "CI checks passed on ${BITBUCKET_BRANCH}"
            # Point the user from where to run the CD pipeline in the Bitbucket GUI
            - echo ""
            - echo "Go to your repository > Pipelines > Run pipeline > Select Branch > Select a pipeline 'custom:\ deploy_dags'"
            - echo "Then choose the appropriate environment (dev / qa / prod) to proceed with deployment."
          after-script:
            # Create a CI success marker file
            - echo "CI_SUCCESS=true" > ci_status.txt
            - echo "CI_COMMIT=${BITBUCKET_COMMIT}" >> ci_status.txt
            - echo "CI_BRANCH=${BITBUCKET_BRANCH}" >> ci_status.txt
            - echo "CI_BUILD_NUMBER=${BITBUCKET_BUILD_NUMBER}" >> ci_status.txt
          artifacts:
            - ci_status.txt

  custom:
    deploy_dags:
      - variables:
          - name: ENVIRONMENT
            description: "Select deployment environment"
            default: dev
            allowed-values:
              - dev
              - qa
              - prod
          - name: COMMIT_SHA
            description: "Select commit to deploy (leave empty for HEAD)"
            default: ""
      - step:
          name: Pre-deployment validation
          image: alpine/git
          script:
            # Check if CI has passed for this branch
            - |
              if [ ! -f ci_status.txt ]; then
                echo "❌ ERROR: CI status file not found!"
                echo "❌ CI pipeline must be run successfully before deployment."
                echo "❌ Please run the CI pipeline on this branch first."
                exit 1
              fi
            - source ci_status.txt
            - |
              if [ "$CI_SUCCESS" != "true" ]; then
                echo "❌ ERROR: CI pipeline failed!"
                echo "❌ Cannot proceed with deployment until CI passes."
                exit 1
              fi
            - echo "✅ CI validation passed for commit ${CI_COMMIT}"
            - |
              if [ -n "$COMMIT_SHA" ]; then
                echo "🔄 Checking out specific commit: $COMMIT_SHA"
                git checkout $COMMIT_SHA
              else
                echo "📍 Using HEAD commit: ${BITBUCKET_COMMIT}"
              fi
          artifacts:
            - ci_status.txt
      - step:
          name: Deployment stage triggered
          image: amazon/aws-cli
          script:
            # Load CI status
            - source ci_status.txt
            - echo "✅ Deploying commit ${CI_COMMIT} that passed CI in build ${CI_BUILD_NUMBER}"
            
            # AWS-REGION based ENV selection logic
            - source ./.bitbucket/scripts/map_region.sh
            - echo "Deploying to $ENVIRONMENT in $AWS_DEFAULT_REGION"
            
            # Pre-requisite setup
            - echo "Deploying to -> ${ENVIRONMENT}"
            - export DEPLOY_ENV="${ENVIRONMENT}"
            - export S3_BUCKET="${DEPLOY_ENV}-brightline-mdf-data-lake"
            - export S3_PATH="artifacts/airflow"
            - export TIMESTAMP=$(date +%Y%m%d)-${BITBUCKET_BUILD_NUMBER}
            
            # Backup older directories
            - echo "Backing up existing DAGs from s3://${S3_BUCKET}/${S3_PATH} to s3://${S3_BUCKET}/backups/${TIMESTAMP}/"
            - aws s3 cp "s3://${S3_BUCKET}/${S3_PATH}/" "s3://${S3_BUCKET}/backups/${TIMESTAMP}/" --recursive
            
            # Copying files from bitbucket master to bucket
            - echo "Uploading new DAGs and scripts to s3://${S3_BUCKET}/${S3_PATH}/"
            - aws s3 cp dags/ "s3://${S3_BUCKET}/${S3_PATH}/dags/" --recursive
            - aws s3 cp requirements/ "s3://${S3_BUCKET}/${S3_PATH}/requirements/" --recursive
            - aws s3 cp scripts/ "s3://${S3_BUCKET}/${S3_PATH}/scripts/" --recursive
            - aws s3 cp CHANGELOG.md "s3://${S3_BUCKET}/${S3_PATH}/CHANGELOG.md"
            - aws s3 cp VERSION.txt "s3://${S3_BUCKET}/${S3_PATH}/VERSION.txt"
            - echo "DAG deployment complete. Backup stored at s3://${S3_BUCKET}/backups/${TIMESTAMP}/"