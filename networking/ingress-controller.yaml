---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/instance: ingress-nginx
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  chart: ingress-nginx
  repo: https://kubernetes.github.io/ingress-nginx
  targetNamespace: ingress-nginx
  valuesContent: |-
    controller:
      # Enable for vCluster support
      allowSnippetAnnotations: true
      
      # Service configuration for AWS LoadBalancer
      service:
        type: LoadBalancer
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
          service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
          service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
      
      # Resources
      resources:
        requests:
          cpu: 100m
          memory: 90Mi
        limits:
          cpu: 200m
          memory: 256Mi
      
      # Enable metrics
      metrics:
        enabled: true
        service:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "10254"
      
      # Configuration for vCluster support
      config:
        # Enable real IP forwarding
        use-forwarded-headers: "true"
        compute-full-forwarded-for: "true"
        
        # SSL Configuration
        ssl-protocols: "TLSv1.2 TLSv1.3"
        ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
        
        # Performance tuning
        worker-processes: "auto"
        worker-connections: "16384"
        max-worker-open-files: "32768"
        
        # Timeouts
        proxy-connect-timeout: "5"
        proxy-send-timeout: "60"
        proxy-read-timeout: "60"
        
        # Buffer sizes
        proxy-buffer-size: "4k"
        proxy-buffers-number: "8"
        
        # Enable gzip
        enable-gzip: "true"
        gzip-level: "6"
        gzip-types: "application/atom+xml application/javascript application/json application/rss+xml application/vnd.ms-fontobject application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/svg+xml image/x-icon text/css text/plain text/x-component"
      
      # Node selection for ingress controller
      nodeSelector:
        kubernetes.io/os: linux
      
      # Tolerations for dedicated nodes (if needed)
      tolerations: []
      
      # Affinity rules
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - ingress-nginx
              topologyKey: kubernetes.io/hostname
    
    # Default backend
    defaultBackend:
      enabled: true
      image:
        registry: registry.k8s.io
        image: defaultbackend-amd64
        tag: "1.5"
      
      resources:
        requests:
          cpu: 10m
          memory: 20Mi
        limits:
          cpu: 20m
          memory: 40Mi